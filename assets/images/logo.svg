<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <defs>
    <linearGradient id="goldArchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFCA9E" />
      <stop offset="50%" stop-color="#B99A63" />
      <stop offset="100%" stop-color="#8F7241" />
    </linearGradient>
    <linearGradient id="navyArchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10243A" />
      <stop offset="100%" stop-color="#0B1725" />
    </linearGradient>
  </defs>

  <!-- Geometric Architectural Emblem -->
  <g transform="translate(10, 8)">
    <path d="M36 4 L68 28 L68 64 L36 72 L4 64 L4 28 Z" fill="url(#navyArchGrad)" stroke="url(#goldArchGrad)" stroke-width="2" />
    <path d="M36 4 L36 72" stroke="url(#goldArchGrad)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8" />
    <path d="M4 28 L36 46 L68 28" fill="none" stroke="url(#goldArchGrad)" stroke-width="1.8" />
    <!-- Monogram PC -->
    <path d="M22 24 L22 52 M22 24 H32 C36 24 38 27 38 31 C38 35 36 38 32 38 H22" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M50 38 C48 35 44 33 40 33 C34 33 30 38 30 45 C30 52 34 57 40 57 C45 57 49 54 50 50" fill="none" stroke="url(#goldArchGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="12" y1="67" x2="60" y2="67" stroke="url(#goldArchGrad)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <g transform="translate(90, 16)">
    <!-- Primary Brand Name in Editorial Serif -->
    <text x="0" y="27" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">
      POONAM
    </text>
    <text x="126" y="27" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="400" letter-spacing="2.5" fill="url(#goldArchGrad)">
      CONSTRUCTION
    </text>

    <!-- Subtitle / Engineering Credential in Technical Space Grotesk -->
    <text x="1" y="46" font-family="'Space Grotesk', sans-serif" font-size="8.5" font-weight="600" letter-spacing="3.5" fill="#D9C7A3">
      ENGINEERS &amp; CONTRACTORS
    </text>
    <circle cx="178" cy="43" r="1.8" fill="#B99A63" />
    <text x="186" y="46" font-family="'Space Grotesk', sans-serif" font-size="8.5" font-weight="500" letter-spacing="1.5" fill="#CBD5E1">
      KOLHAPUR
    </text>

    <!-- Er. Name Pill -->
    <rect x="0" y="53" width="235" height="16" rx="2" fill="rgba(185, 154, 99, 0.15)" stroke="rgba(185, 154, 99, 0.35)" stroke-width="0.8" />
    <text x="6" y="64" font-family="'Space Grotesk', sans-serif" font-size="7.5" font-weight="600" letter-spacing="1" fill="#DFCA9E">
      ER. PRATIK D. CHOUGULE (B.E. CIVIL)
    </text>
  </g>
</svg>
